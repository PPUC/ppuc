name: ppuc
on:
  pull_request:
  push:

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Detect version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION_MAJOR=$(grep -Eo "PPUC_EXECUTABLE_VERSION_MAJOR\s+[0-9]+" src/ppuc_version.h | grep -Eo "[0-9]+")
          VERSION_MINOR=$(grep -Eo "PPUC_EXECUTABLE_VERSION_MINOR\s+[0-9]+" src/ppuc_version.h | grep -Eo "[0-9]+")
          VERSION_PATCH=$(grep -Eo "PPUC_EXECUTABLE_VERSION_PATCH\s+[0-9]+" src/ppuc_version.h | grep -Eo "[0-9]+")
          TAG="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          echo "${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  build:
    name: Build ppuc-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: [ version ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win-mingw
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          #- os: macos-latest
          #  platform: macos
          #  arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          #- os: ubuntu-latest
          #  platform: linux
          #  arch: aarch64
    steps:
      - uses: actions/checkout@v6
      - id: depkey
        name: Compute dependency cache key
        run: |
          # Hash only what actually decides whether a dependency must be
          # rebuilt: the heavy third-party pins plus this platform's
          # external.sh (its build logic).
          #
          # LIBPPUC_SHA is deliberately NOT in the key. It changes on almost
          # every commit, but staging libppuc takes seconds, while vpinball,
          # pinmame, SDL, flite and espeak-ng are most of the build. Including
          # it would throw away a ~2 GB cache to save a few seconds of work.
          # external.sh re-stages libppuc on its own anyway, because its
          # per-dependency cache.txt marker will not match.
          KEY=$( {
            grep -E '^(VPINBALL_SHA|LIBSDLDMD_SHA|PINMAME_SHA|PINMAME_NVRAM_MAPS_SHA|SDL_IMAGE_SHA|SDL_MIXER_SHA|FLITE_SHA|ESPEAK_NG_SHA|LUA_VERSION)=' platforms/config.sh
            cat platforms/${{ matrix.platform }}/${{ matrix.arch }}/external.sh
          } | git hash-object --stdin )
          echo "key=${KEY}" >> "$GITHUB_OUTPUT"
      - name: Cache third-party dependencies
        uses: actions/cache@v5
        with:
          # external/ holds the dependency source and build trees; third-party/
          # holds the headers and libraries staged out of them. Both are needed:
          # on a cache hit external.sh skips a dependency entirely, including
          # the step that copies its artifacts into third-party/.
          #
          # ppuc's own build/ is deliberately not cached. Its sources change
          # every commit, and caching it would weaken the "rebuild must be a
          # no-op" guard below.
          path: |
            external
            third-party
          key: ppuc-deps-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.depkey.outputs.key }}
          # A partial hit is still worth a lot: external.sh rebuilds only the
          # dependencies whose own cache.txt no longer matches and leaves the
          # rest untouched.
          restore-keys: |
            ppuc-deps-${{ matrix.platform }}-${{ matrix.arch }}-
      - if: (matrix.platform != 'macos')
        name: Patch SHA into ppuc_version.h
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          sed -i 's/^#define PPUC_EXECUTABLE_SHA .*/#define PPUC_EXECUTABLE_SHA "'$GIT_SHA'"/' src/ppuc_version.h
      - if: (matrix.platform == 'macos')
        name: Patch SHA into ppuc_version.h
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          sed -i '' 's/^#define PPUC_EXECUTABLE_SHA .*/#define PPUC_EXECUTABLE_SHA "'$GIT_SHA'"/' src/ppuc_version.h
      - if: (matrix.platform == 'win-mingw')
        name: Set up MSYS2 MinGW (win runner)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            bison
            diffutils
            git
            libtool
            make
            nasm
            unzip
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-libwinpthread
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-tools
            mingw-w64-ucrt-x86_64-zlib
      - if: (matrix.platform == 'macos')
        name: Add autoconf and automake (mac runner)
        run: |
           brew install autoconf automake gcc-aarch64-embedded aarch64-elf-gcc libtool
      - if: (matrix.platform == 'linux' && matrix.arch == 'x64')
        name: Install packages (linux runner)
        run: |
          sudo apt update -y
          sudo apt install autoconf libtool nasm libudev-dev libpipewire-0.3-dev libwayland-dev wayland-protocols libxml2-utils libdecor-0-dev liburing-dev libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev
      - if: (matrix.platform == 'win-mingw')
        name: Build ppuc-${{ matrix.platform }}-${{ matrix.arch }}
        shell: msys2 {0}
        run: |
          ./platforms/${{ matrix.platform }}/${{ matrix.arch }}/build.sh
      - if: (!(matrix.platform == 'linux' && matrix.arch == 'aarch64') && matrix.platform != 'win-mingw')
        name: Build ppuc-${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          ./platforms/${{ matrix.platform }}/${{ matrix.arch }}/build.sh
      - if: (matrix.platform == 'linux' && matrix.arch == 'aarch64')
        name: Build ppuc-${{ matrix.platform }}-${{ matrix.arch }} (arm runner)
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          image_additional_mb: 4096
          cpu: cortex-a53
          cpu_info: cpuinfo/raspberrypi_zero2_w_arm64
          bind_mount_repository: true
          commands: |
            apt update -y --allow-releaseinfo-change
            apt install --no-install-recommends -y git pkg-config cmake autoconf automake libtool nasm libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libgpiod-dev
            ./platforms/${{ matrix.platform }}/${{ matrix.arch }}/build.sh
      - if: (!(matrix.platform == 'linux' && matrix.arch == 'aarch64') && matrix.platform != 'win-mingw')
        name: Unit tests
        run: |
          if [[ "$(uname)" == "Darwin" ]]; then
             NUM_PROCS=$(sysctl -n hw.ncpu)
          else
             NUM_PROCS=$(nproc)
          fi
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=${{ matrix.platform }} \
            -DARCH=${{ matrix.arch }} \
            -DPPUC_BUILD_TESTS=ON \
            -DPPUC_BUILD_MENU=OFF \
            -DPPUC_BUILD_BACKBOX=OFF \
            -B build-tests
          cmake --build build-tests --target ppuc_tests -- -j${NUM_PROCS}
          ctest --test-dir build-tests --output-on-failure
      - if: (matrix.platform == 'linux' && matrix.arch == 'x64')
        name: Rebuild must be a no-op
        run: |
          # Three of four build-caching defects found during this work were
          # completely silent: no error, just work redone every time. A second
          # build with nothing changed must compile nothing at all.
          ./platforms/${{ matrix.platform }}/${{ matrix.arch }}/build.sh > /tmp/rebuild.log 2>&1
          if grep -qE "Building (CXX|C) object" /tmp/rebuild.log; then
            echo "::error::A rebuild with no changes recompiled the following:"
            grep -E "Building (CXX|C) object" /tmp/rebuild.log | head -40
            echo ""
            echo "Something is invalidating a cache or restamping a staged file."
            echo "See docs/STABILIZATION_PLAN.md section 4.5."
            exit 1
          fi
          echo "Rebuild recompiled nothing, as expected."
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ppuc-${{ needs.version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ppuc

  firmware:
    name: Build board firmware
    runs-on: ubuntu-24.04
    needs: [ version ]
    steps:
      - uses: actions/checkout@v6

      - name: Resolve the pinned io-boards revision
        id: pin
        # Firmware shipped with a release has to be the firmware this release
        # was built against, so it comes from the pin chain rather than from
        # whatever io-boards main happens to be. ppuc pins libppuc, libppuc
        # pins io-boards.
        run: |
          LIBPPUC_SHA=$(grep -oE '^LIBPPUC_SHA=.*' platforms/config.sh | cut -d= -f2)
          IO_BOARDS_SHA=$(curl -sfL \
            "https://raw.githubusercontent.com/PPUC/libppuc/${LIBPPUC_SHA}/platforms/config.sh" \
            | grep -oE '^IO_BOARDS_SHA=.*' | cut -d= -f2)
          if [ -z "${IO_BOARDS_SHA}" ]; then
            echo "::error::could not resolve IO_BOARDS_SHA through libppuc ${LIBPPUC_SHA}"
            exit 1
          fi
          echo "libppuc   ${LIBPPUC_SHA}"
          echo "io-boards ${IO_BOARDS_SHA}"
          echo "sha=${IO_BOARDS_SHA}" >> $GITHUB_OUTPUT

      - name: Fetch io-boards at the pinned revision
        run: |
          curl -sfL "https://github.com/PPUC/io-boards/archive/${{ steps.pin.outputs.sha }}.tar.gz" -o io-boards.tar.gz
          mkdir io-boards
          tar xzf io-boards.tar.gz --strip-components=1 -C io-boards

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-firmware-${{ steps.pin.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-platformio-firmware-

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build every board type
        working-directory: io-boards
        # Every environment, because a release that ships firmware for some
        # boards and not others is worse than one that ships none: the update
        # path silently skips the boards it has no image for.
        run: |
          FW_VERSION=$(grep -Eo "FIRMWARE_VERSION_MAJOR\s+[0-9]+" src/PPUC.h | grep -Eo "[0-9]+").$(grep -Eo "FIRMWARE_VERSION_MINOR\s+[0-9]+" src/PPUC.h | grep -Eo "[0-9]+").$(grep -Eo "FIRMWARE_VERSION_PATCH\s+[0-9]+" src/PPUC.h | grep -Eo "[0-9]+")
          echo "firmware version ${FW_VERSION}"
          mkdir -p ../firmware
          for ENV in $(python3 -c "import re;print(' '.join(e for e in re.findall(r'\[env:([^\]]+)\]', open('platformio.ini').read()) if e != 'native'))"); do
            echo "building ${ENV}"
            pio run -e "${ENV}"
            # Named <board type>-<version>.uf2, which is what ppuc-pinmame
            # matches against a board's reported type and version.
            cp ".pio/build/${ENV}/firmware.uf2" "../firmware/${ENV}-${FW_VERSION}.uf2"
          done
          ls -l ../firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ppuc-${{ needs.version.outputs.tag }}-firmware
          path: firmware

  post-build:
    runs-on: macos-latest
    needs: [ version, build, firmware ]
    name: Release ppuc
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Package artifacts
        run: |
          mkdir release
          FIRMWARE_DIR="ppuc-${{ needs.version.outputs.tag }}-firmware"
          for artifact in ppuc-${{ needs.version.outputs.tag }}-*; do
            [ "${artifact}" = "${FIRMWARE_DIR}" ] && continue
            # Ship the board firmware inside every platform archive, so a
            # --firmware-path can point at the unpacked release directly.
            if [ -d "${FIRMWARE_DIR}" ]; then
              cp -a "${FIRMWARE_DIR}" "${artifact}/firmware"
            fi
            zip -r "release/${artifact}.zip" "${artifact}"
          done
          # And alongside, for flashing over USB without unpacking a platform
          # build.
          cp "${FIRMWARE_DIR}"/*.uf2 release/ 2>/dev/null || true
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: true
          files: |
            release/*.zip
            release/*.uf2
