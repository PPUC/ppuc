[configuration]
id = "FakeCtl"
name = "FakeCtl"
description = "Observes the PPUC plugin bus and logs what it sees"
author = "PPUC"
version = "1.0"
link = "https://github.com/PPUC/ppuc"

[libraries]
windows.x86 = "plugin-fakectl.dll"
windows.x64 = "plugin-fakectl64.dll"
linux.x64 = "plugin-fakectl.so"
linux.aarch64 = "plugin-fakectl.so"
macos.x64 = "plugin-fakectl.dylib"
macos.arm64 = "plugin-fakectl.dylib"
